name: Deploy FTP DomaiNesia

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy ke DomaiNesia
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, pdo_sqlite, sqlite3, fileinfo, zip, gd
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      # Jika secret ENV_FILE diisi (hasil base64 dari file .env produksi),
      # file lingkungan akan dibuat untuk keperluan build (bukan di-upload ke server).
      - name: Siapkan .env untuk build
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" | base64 -d > .env
          else
            cp .env.example .env
          fi

      - name: Install dependency PHP (tanpa dev)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Build aset frontend (Vite)
        run: |
          npm ci
          npm run build

      - name: Deploy aplikasi ke folder web-religi
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ${{ secrets.FTP_PROTOCOL }}
          server-dir: /${{ secrets.FTP_SERVER_DIR }}/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.env
            **/.env.*
            public/**
            deploy-public/**
            storage/framework/**
            storage/logs/**
            storage/app/public/uploads/**
            storage/app/private/**
            database/*.sqlite
            database/*.sqlite-journal
            .ftp-deploy-sync-state.json

      - name: Siapkan isi folder public untuk docroot
        run: |
          rm -rf deploy-public
          mkdir -p deploy-public
          cp -r public/. deploy-public/
          APP_DIR=$(echo "${{ secrets.FTP_SERVER_DIR }}" | tr -d '/')
          sed -i "s|__DIR__.'/../vendor/autoload.php'|__DIR__.'/${APP_DIR}/vendor/autoload.php'|" deploy-public/index.php
          sed -i "s|__DIR__.'/../bootstrap/app.php'|__DIR__.'/${APP_DIR}/bootstrap/app.php'|" deploy-public/index.php

      - name: Deploy isi public ke docroot (public_html)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ${{ secrets.FTP_PROTOCOL }}
          local-dir: deploy-public/
          server-dir: /${{ secrets.FTP_DOCROOT }}/
          dangerous-clean-slate: true
          exclude: |
            storage
            .user.ini